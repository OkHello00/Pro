
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Умный математический калькулятор</title>

<script src="https://cdn.jsdelivr.net/npm/mathjs@13.2.0/lib/browser/math.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #101827, #202b45);
  color: white;
}

h1 { text-align: center; font-size: 27px; }

.container {
  max-width: 950px;
  margin: auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.panel {
  background: #202b40;
  padding: 18px;
  border-radius: 18px;
  box-shadow: 0 5px 20px #0004;
  min-width: 0;
}

h2 { font-size: 19px; }

canvas {
  width: 100%;
  height: 240px;
  background: white;
  border-radius: 10px;
  touch-action: none;
  cursor: crosshair;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #52617b;
  border-radius: 9px;
  background: #111b2d;
  color: white;
  font-size: 18px;
  margin: 7px 0;
}

button {
  border: 0;
  border-radius: 9px;
  padding: 12px;
  margin: 3px 0;
  cursor: pointer;
  font-size: 16px;
  background: #34445f;
  color: white;
}

button:active { transform: scale(.97); }
.primary { background: #7257ed; }
.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-top: 12px;
}
.buttons button { min-width: 0; }

.result {
  background: #111b2d;
  padding: 15px;
  border-radius: 10px;
  min-height: 55px;
  overflow-wrap: anywhere;
  font-size: 21px;
  color: #7df5c4;
}

.hint { color: #b8c4d9; font-size: 13px; }
#status { color: #ffd479; font-size: 13px; }

@media(max-width:650px) {
  .container { grid-template-columns: 1fr; }
  body { padding: 12px; }
}
</style>
</head>

<body>
<h1>🧮 Умный калькулятор</h1>

<div class="container">

  <section class="panel">
    <h2>✍️ Напиши формулу рукой</h2>
    <p class="hint">Пиши пальцем на телефоне или мышкой.</p>

    <canvas id="pad"></canvas>

    <div style="display:flex;gap:6px;margin-top:8px">
      <button onclick="clearPad()">Очистить</button>
      <button class="primary" onclick="recognize()">
        Распознать формулу
      </button>
    </div>

    <p id="status">
      Для автоматического распознавания настрой OCR в коде.
    </p>

    <h2>Формула сбоку</h2>
    <input id="expression" placeholder="Например: sqrt(25) + 3^2">

    <button class="primary" style="width:100%"
      onclick="calculate()">Решить задачу</button>

    <h2>Ответ</h2>
    <div class="result" id="answer">Здесь появится ответ</div>
  </section>

  <section class="panel">
    <h2>🔢 Калькулятор</h2>

    <input id="display" placeholder="Введите выражение"
      onkeydown="if(event.key==='Enter')calculate()">

    <div class="buttons">
      <button onclick="add('7')">7</button>
      <button onclick="add('8')">8</button>
      <button onclick="add('9')">9</button>
      <button onclick="add('/')">÷</button>

      <button onclick="add('4')">4</button>
      <button onclick="add('5')">5</button>
      <button onclick="add('6')">6</button>
      <button onclick="add('*')">×</button>

      <button onclick="add('1')">1</button>
      <button onclick="add('2')">2</button>
      <button onclick="add('3')">3</button>
      <button onclick="add('-')">−</button>

      <button onclick="add('0')">0</button>
      <button onclick="add('.')">.</button>
      <button onclick="add('(')">(</button>
      <button onclick="add(')')">)</button>

      <button onclick="add('sqrt(')">√</button>
      <button onclick="add('^2')">x²</button>
      <button onclick="add('^')">xʸ</button>
      <button onclick="add('+')">+</button>

      <button onclick="add('pi')">π</button>
      <button onclick="add('sin(')">sin</button>
      <button onclick="add('cos(')">cos</button>
      <button onclick="add('log(')">log</button>

      <button onclick="add('abs(')">|x|</button>
      <button onclick="add('sqrt(')">sqrt</button>
      <button onclick="backspace()">⌫</button>
      <button onclick="clearDisplay()">C</button>
    </div>

    <button class="primary" style="width:100%;margin-top:12px"
      onclick="calculate()">= Вычислить</button>

    <p class="hint">
      Примеры: sqrt(144), 2^10, (5+3)/2,
      sin(pi/2), log(100,10).
    </p>
  </section>

</div>

<script>
const display = document.getElementById('display');
const expression = document.getElementById('expression');
const answer = document.getElementById('answer');

function add(value) {
  display.value += value;
  display.focus();
}

function backspace() {
  display.value = display.value.slice(0, -1);
}

function clearDisplay() {
  display.value = '';
}

function calculate() {
  const input = expression.value.trim() || display.value.trim();

  if (!input) {
    answer.textContent = 'Сначала введи выражение';
    return;
  }

  try {
    const result = math.evaluate(input);
    answer.textContent = math.format(result, {precision: 12});
  } catch (error) {
    answer.textContent = 'Проверь правильность выражения';
  }
}

// Поле для рисования пальцем или мышкой
const canvas = document.getElementById('pad');
const ctx = canvas.getContext('2d');
let drawing = false;
let strokes = [];
let currentStroke = [];

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const image = canvas.toDataURL();
  canvas.width = rect.width * devicePixelRatio;
  canvas.height = rect.height * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#15233d';

  const img = new Image();
  img.onload = () => {
    ctx.drawImage(img, 0, 0, rect.width, rect.height);
  };
  img.src = image;
}

new ResizeObserver(resizeCanvas).observe(canvas);

function point(event) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: event.clientX - rect.left,
    y: event.clientY - rect.top
  };
}

canvas.addEventListener('pointerdown', event => {
  drawing = true;
  currentStroke = [];
  canvas.setPointerCapture(event.pointerId);
  const p = point(event);
  currentStroke.push(p);
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
});

canvas.addEventListener('pointermove', event => {
  if (!drawing) return;
  const p = point(event);
  currentStroke.push(p);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
});

function stopDrawing() {
  if (!drawing) return;
  drawing = false;
  strokes.push(currentStroke);
}

canvas.addEventListener('pointerup', stopDrawing);
canvas.addEventListener('pointercancel', stopDrawing);

function clearPad() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  strokes = [];
  currentStroke = [];
  document.getElementById('status').textContent =
    'Поле очищено. Можно писать заново.';
}

// Здесь подключается OCR-сервис.
// Без API распознавание рукописного текста не выполняется.
async function recognize() {
  document.getElementById('status').textContent =
    'Поле готово к подключению OCR. Настрой API распознавания формул.';
}
</script>
</body>
</html>
